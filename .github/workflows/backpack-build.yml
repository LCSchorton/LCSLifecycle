name: Build Backpack

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Backpack
        shell: pwsh
        run: |
          dotnet publish src/Lcs.Web/Lcs.Web.csproj -c Release -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path publish/web.config)) { throw 'IIS web.config is missing.' }
          Compress-Archive -Path publish/* -DestinationPath Backpack.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Backpack-IIS
          path: Backpack.zip
          if-no-files-found: error
          retention-days: 14
